services:
  news-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news-platform
    environment:
      - SERVICE_PORT=${SERVICE_PORT:-8003}
      - DATA_DIR=/app/data
      - API_KEY=${API_KEY:-}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-en}
      - REQUEST_TIMEOUT_SECONDS=${REQUEST_TIMEOUT_SECONDS:-12}
      - MAX_FEED_ENTRIES=${MAX_FEED_ENTRIES:-40}
      - LIBRETRANSLATE_URL=http://libretranslate:5000
      - SCHEDULE_INTERVAL_MINUTES=${SCHEDULE_INTERVAL_MINUTES:-30}
    ports:
      - "${SERVICE_PORT:-8003}:8003"
    volumes:
      - ./data:/app/data
    depends_on:
      libretranslate:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: libretranslate
    ports:
      - "5005:5000"
    environment:
      - LT_LOAD_ONLY=en,fa,de
      - LT_DISABLE_WEB_UI=true
    volumes:
      - libretranslate-data:/home/libretranslate/.local
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; data=urllib.request.urlopen('http://localhost:5000/languages').read().decode(); exit(0 if 'Persian' in data else 1)\""]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s

volumes:
  libretranslate-data:

networks:
  default:
    name: news-feed-network
