services:
  news-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news-platform
    environment:
      - SERVICE_PORT=${SERVICE_PORT:-8003}
      - DATA_DIR=/app/data
      - API_KEY=${API_KEY:-}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-en}
      - REQUEST_TIMEOUT_SECONDS=${REQUEST_TIMEOUT_SECONDS:-12}
      - MAX_FEED_ENTRIES=${MAX_FEED_ENTRIES:-40}
    ports:
      - "${SERVICE_PORT:-8003}:${SERVICE_PORT:-8003}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${SERVICE_PORT:-8003}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
